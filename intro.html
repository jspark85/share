<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 GitHub 웹사이트</title>
    <style>
        /* 웹페이지 디자인 (CSS) */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            font-family: '맑은 고딕', sans-serif;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            font-size: 18px;
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #27ae60;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 환영합니다!</h1>
        <p>GitHub Pages로 띄운 나의 첫 번째 웹사이트입니다.</p>
        
        <button onclick="alert('버튼 클릭 성공! HTML, CSS, JS가 모두 완벽하게 작동하네요! 🚀')">
            여기를 눌러보세요
        </button>
    </div>

</body>
</html>
